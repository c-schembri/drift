name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        compiler: [auto]
        include:
          - os: ubuntu-latest
            compiler: clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Install Linux desktop headers
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'auto'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev \
            libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev libpipewire-0.3-dev \
            libwayland-dev libdecor-0-dev liburing-dev
      - run: uv run ruff check .
      - run: uv run mypy driftbuild
      - run: uv run pytest
        env:
          DRIFT_TEST_COMPILER: ${{ matrix.compiler }}
      - name: Build SDL3 example
        if: matrix.compiler == 'auto'
        run: uv run drift build examples/sdl3-window
      - name: Build Meson package example
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'auto'
        run: uv run drift build examples/inih
