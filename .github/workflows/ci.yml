name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        compiler: [auto]
        include:
          - os: ubuntu-latest
            compiler: clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Install Linux desktop headers
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'auto'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev
      - run: uv run ruff check .
      - run: uv run mypy driftbuild
      - run: uv run pytest
        env:
          DRIFT_TEST_COMPILER: ${{ matrix.compiler }}
      - name: Build SDL3 example
        if: matrix.compiler == 'auto'
        run: uv run drift build examples/sdl3-window
