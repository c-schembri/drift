name: Dependency compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    paths:
      - "driftbuild/**"
      - "compatibility/**"
      - "examples/inih/**"
      - "examples/sdl3-window/**"
      - ".github/workflows/compatibility.yml"
  pull_request:
    paths:
      - "driftbuild/**"
      - "compatibility/**"
      - "examples/inih/**"
      - "examples/sdl3-window/**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            project: compatibility/zlib
            run: zlib-smoke
          - os: ubuntu-latest
            project: compatibility/zlib
            run: zlib-smoke
          - os: macos-latest
            project: compatibility/zlib
            run: zlib-smoke
          - os: ubuntu-latest
            project: examples/inih
            run: inih-example
          - os: windows-latest
            project: examples/sdl3-window
            run: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Build compatibility case
        run: uv run drift build ${{ matrix.project }}
      - name: Run compatibility case
        if: matrix.run != ''
        run: uv run drift run ${{ matrix.project }} ${{ matrix.run }}
